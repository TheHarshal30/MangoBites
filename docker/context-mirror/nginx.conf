# Local mirror for www.w3.org / w3id.org JSON-LD contexts (HTTPS, cert from the playground's test
# CA which only the Inji containers trust). Known contexts are served from disk; anything else is
# proxied to the real host so nothing breaks if a credential uses another context.
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

map $host $mirror_root { default /srv/www.w3.org; w3id.org /srv/w3id.org; }

server {
  listen 443 ssl;
  listen 80;
  server_name www.w3.org w3.org w3id.org;
  ssl_certificate     /etc/nginx/certs/mirror.crt;
  ssl_certificate_key /etc/nginx/certs/mirror.key;

  default_type application/ld+json;
  add_header Access-Control-Allow-Origin * always;
  add_header X-Context-Mirror hit always;

  location / {
    root $mirror_root;
    try_files $uri $uri.jsonld @upstream;
  }

  location @upstream {
    proxy_pass https://$host$request_uri;
    proxy_ssl_server_name on;
    proxy_set_header Host $host;
    proxy_set_header Accept "application/ld+json, application/json";
  }
}
