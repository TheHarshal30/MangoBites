# Exposes Certify at http://localhost:8090 and maps the root-level .well-known documents that
# OpenID4VCI wallets derive from credential_issuer (= http://localhost:8090, no path).
server {
  listen 8090;
  client_max_body_size 4m;
  location /v1/certify/ { proxy_pass http://certify:8090/v1/certify/; proxy_set_header Host $http_host; }
  location = /.well-known/openid-credential-issuer { proxy_pass http://certify:8090/v1/certify/.well-known/openid-credential-issuer; proxy_set_header Host $http_host; }
  location = /.well-known/oauth-authorization-server { proxy_pass http://certify:8090/v1/certify/.well-known/oauth-authorization-server; proxy_set_header Host $http_host; }
  location = /.well-known/did.json { proxy_pass http://certify:8090/v1/certify/.well-known/did.json; proxy_set_header Host $http_host; }
}
