# Inji Certify 0.14 — standalone profile for the Interop Playground.
# Certify acts as its own OAuth authorization server (pre-authorized code flow), so no eSignet.
# One base URL (http://localhost:8090) must work both from the host and inside the container:
# on the host it is certify-nginx; inside the container it is Certify itself.
mosip.certify.domain.url=http://localhost:8090
mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.authorization.url=${mosip.certify.domain.url}
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}
mosip.certify.authn.jwk-set-uri=${mosip.certify.authorization.url}${server.servlet.path}/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential' }
mosip.certify.oauth.issuer=${mosip.certify.authorization.url}

mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MockVCIssuancePlugin
mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://mosip.io/credential/
mosip.certify.data-provider-plugin.rendering-template-id=
# Replaced at bootstrap by scripts/bootstrap-certify (did:key of Certify's own Ed25519 key) so
# verifiers can resolve the issuer offline; did:web would need public HTTPS.
mosip.certify.data-provider-plugin.did-url=${CERTIFY_ISSUER_DID:did:web:localhost%3A8090}
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020
mosip.certify.issuer.ledger-enabled=false

# The stock 40s window is too short for interactive / mobile flows.
mosip.certify.cnonce-expire-seconds=600
mosip.certify.pre-auth.default-expiry-seconds=1800
mosip.certify.credential-offer-url=${mosip.certify.domain.url}${server.servlet.path}/credential-offer-data/
mosip.certify.credential-config.issuer.display={{'name': 'Inji Certify (local)', 'locale': 'en'}}

# Required by beans in the bundled mock plugin package even when they are not the active plugin.
mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
mosip.certify.mock.authenticator.get-identity-url=http://localhost:8090/unused
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
mosip.certify.mock.data-provider.csv.identifier-column=id
mosip.certify.mock.data-provider.csv.data-columns=id,fullName
mosip.certify.mock.data-provider.csv-registry-uri=/home/mosip/config/unused.csv

# The docker-compose certify-default.properties in 0.14 omits credentialOfferCache (and
# issuerMetadataCache), so POST /pre-authorized-data fails with "credentialOfferCache not
# available". List every cache the pre-auth flow needs (from application-local.properties).
mosip.certify.cache.names=userinfo,vcissuance,templatecache,certificatedatacache,credentialConfig,renderTemplate,jwks,preAuthCodeCache,credentialOfferCache,issuerMetadataCache,asMetadataCache
